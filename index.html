<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw + Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #f5f0e8;
    --cream-dark: #e8e0d0;
    --ink: #1a1a1a;
    --ink-light: #4a4a4a;
    --accent: #e85d3a;
    --accent-glow: #ff7b5c;
    --chat-bg: #111111;
    --chat-surface: #1a1a1a;
    --chat-text: #e0ddd5;
    --chat-muted: #888;
  }

  html, body { height: 100%; overflow: hidden; background: var(--ink); font-family: 'DM Sans', sans-serif; }

  #app { display: flex; height: 100vh; width: 100vw; }

  /* ── API Key Modal ── */
  #api-modal {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
  }
  #api-modal.hidden { display: none; }

  #api-modal-inner {
    background: #1a1a1a; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 40px; max-width: 460px; width: 90%; text-align: center;
  }
  #api-modal-inner h1 {
    font-family: 'Space Mono', monospace; font-size: 14px; color: var(--accent);
    letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px;
  }
  #api-modal-inner .subtitle {
    color: var(--chat-muted); font-size: 13px; line-height: 1.6; margin-bottom: 24px;
  }
  #api-key-input {
    width: 100%; padding: 14px 16px; background: #111;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    color: #fff; font-family: 'Space Mono', monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s; margin-bottom: 16px;
  }
  #api-key-input:focus { border-color: var(--accent); }
  #api-key-input::placeholder { color: #555; }

  #api-submit-btn {
    width: 100%; padding: 14px; background: var(--accent); border: none;
    border-radius: 12px; color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    margin-bottom: 12px;
  }
  #api-submit-btn:hover { background: var(--accent-glow); }

  #skip-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: var(--chat-muted); padding: 10px 20px; border-radius: 10px;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  #skip-btn:hover { border-color: rgba(255,255,255,0.3); color: #ccc; }
  .api-error { color: #ff6b6b; font-size: 12px; margin-top: 8px; display: none; }

  /* ── LEFT: Canvas Side ── */
  #canvas-side {
    flex: 1; position: relative; background: var(--cream);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #drawing-canvas { flex: 1; cursor: crosshair; touch-action: none; }

  /* Toolbar */
  #toolbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    background: rgba(26,26,26,0.92); backdrop-filter: blur(12px);
    padding: 10px 16px; border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35); z-index: 10;
  }
  .tool-group { display: flex; align-items: center; gap: 4px; }
  .tool-group + .tool-group {
    margin-left: 6px; padding-left: 10px;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .tool-btn {
    width: 36px; height: 36px; border: none; border-radius: 10px;
    background: transparent; color: #aaa; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; font-size: 16px; position: relative;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .tool-btn.active { background: var(--accent); color: #fff; }
  .tool-btn svg { width: 18px; height: 18px; }

  #size-slider {
    -webkit-appearance: none; width: 80px; height: 4px;
    background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
  }
  #size-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    background: #fff; border-radius: 50%; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  .color-swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; transition: all 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

  #size-preview {
    position: absolute; pointer-events: none; border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.3); transform: translate(-50%, -50%);
    z-index: 5; display: none;
  }

  #clear-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.15);
    color: #999; padding: 5px 12px; border-radius: 8px; font-size: 11px;
    cursor: pointer; font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px; text-transform: uppercase; transition: all 0.15s;
  }
  #clear-btn:hover { border-color: var(--accent); color: var(--accent); }

  #undo-btn {
    background: transparent; border: none; color: #888; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px; transition: all 0.15s;
  }
  #undo-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  #undo-btn svg { width: 16px; height: 16px; }

  /* AI activity indicator on canvas */
  #ai-activity {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px;
    background: rgba(26,26,26,0.75); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  #ai-activity.visible { opacity: 1; }
  #ai-activity-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1s infinite;
  }
  #ai-activity-text {
    font-family: 'Space Mono', monospace; font-size: 10px;
    color: rgba(255,255,255,0.7); letter-spacing: 1px; text-transform: uppercase;
  }

  /* ── RIGHT: Chat Side ── */
  #chat-side {
    width: 380px; min-width: 320px; background: var(--chat-bg);
    display: flex; flex-direction: column;
    border-left: 1px solid rgba(255,255,255,0.06);
  }

  #chat-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #chat-header h2 {
    font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
  }
  #chat-header p { font-size: 12px; color: var(--chat-muted); line-height: 1.4; }

  #mode-badge {
    display: inline-block; font-family: 'Space Mono', monospace; font-size: 9px;
    padding: 2px 8px; border-radius: 6px; margin-top: 6px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  #mode-badge.live {
    background: rgba(78,203,113,0.15); color: #4ecb71;
    border: 1px solid rgba(78,203,113,0.3);
  }
  #mode-badge.offline {
    background: rgba(255,255,255,0.05); color: #666;
    border: 1px solid rgba(255,255,255,0.1);
  }

  #chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
  }

  .message {
    max-width: 92%; padding: 10px 14px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.55; animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.ai {
    align-self: flex-start; background: var(--chat-surface);
    color: var(--chat-text); border-bottom-left-radius: 4px;
  }
  .message.ai .label {
    font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
  }
  .message.user {
    align-self: flex-end; background: var(--accent);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .message.system {
    align-self: center; background: transparent; color: var(--chat-muted);
    font-size: 11px; font-style: italic; text-align: center; padding: 4px 0;
  }
  .message.drawing-action {
    align-self: flex-start; background: rgba(232,93,58,0.08);
    border: 1px solid rgba(232,93,58,0.15); color: var(--chat-muted);
    font-size: 11px; font-family: 'Space Mono', monospace;
    border-bottom-left-radius: 4px; padding: 6px 12px;
  }

  .typing-indicator {
    display: flex; gap: 4px; padding: 12px 16px; align-self: flex-start;
    background: var(--chat-surface); border-radius: 14px; border-bottom-left-radius: 4px;
  }
  .typing-indicator span {
    width: 6px; height: 6px; background: var(--chat-muted);
    border-radius: 50%; animation: typingDot 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Chat input */
  #chat-input-area {
    padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #chat-input {
    flex: 1; background: var(--chat-surface); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 14px; color: var(--chat-text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
    resize: none; min-height: 40px; max-height: 120px;
    transition: border-color 0.2s; line-height: 1.4;
  }
  #chat-input:focus { border-color: rgba(255,255,255,0.2); }
  #chat-input::placeholder { color: #555; }

  #chat-send {
    width: 40px; height: 40px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  #chat-send:hover { background: var(--accent-glow); }
  #chat-send:disabled { opacity: 0.3; cursor: not-allowed; }
  #chat-send svg { width: 18px; height: 18px; }

  /* Status bar */
  #status-bar {
    padding: 8px 24px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 8px;
  }
  #status-dot {
    width: 7px; height: 7px; background: #4ecb71;
    border-radius: 50%; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #status-text {
    font-size: 11px; color: var(--chat-muted); font-family: 'Space Mono', monospace;
  }

  /* Texture overlay */
  #canvas-side::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    background-repeat: repeat; z-index: 1;
  }

  #ai-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
</style>
</head>
<body>

<!-- API Key Modal -->
<div id="api-modal">
  <div id="api-modal-inner">
    <h1>Draw + Chat</h1>
    <p class="subtitle">
      An AI collaborator that draws alongside you using Claude's vision.<br>
      It interjects into your drawing. You can also direct it via chat.
    </p>
    <input type="password" id="api-key-input" placeholder="sk-ant-... (your Anthropic API key)" autocomplete="off">
    <button id="api-submit-btn">Connect to Claude</button>
    <div class="api-error" id="api-error"></div>
    <br>
    <button id="skip-btn">Skip — draw without AI</button>
  </div>
</div>

<div id="app">
  <!-- LEFT: Drawing Canvas -->
  <div id="canvas-side">
    <canvas id="drawing-canvas"></canvas>
    <canvas id="ai-canvas"></canvas>
    <div id="size-preview"></div>
    <div id="ai-activity">
      <div id="ai-activity-dot"></div>
      <div id="ai-activity-text">AI drawing</div>
    </div>

    <div id="toolbar">
      <div class="tool-group" id="brush-tools">
        <button class="tool-btn active" data-brush="pencil" title="Pencil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3l4 4L7 21H3v-4L17 3z"/></svg>
        </button>
        <button class="tool-btn" data-brush="ink" title="Ink Brush">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19c-4 0-7-2-7-5 0-4 7-12 7-12s7 8 7 12c0 3-3 5-7 5z"/></svg>
        </button>
        <button class="tool-btn" data-brush="marker" title="Marker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="6" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="tool-btn" data-brush="spray" title="Spray">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="8" cy="8" r="0.5"/><circle cx="16" cy="9" r="0.5"/><circle cx="9" cy="15" r="0.5"/><circle cx="15" cy="14" r="0.5"/><circle cx="12" cy="7" r="0.5"/><circle cx="7" cy="12" r="0.5"/><circle cx="17" cy="12" r="0.5"/><circle cx="12" cy="17" r="0.5"/></svg>
        </button>
        <button class="tool-btn" data-brush="eraser" title="Eraser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16l9-9 8 8-4 5z"/><path d="M6 11l8 8"/></svg>
        </button>
      </div>

      <div class="tool-group">
        <input type="range" id="size-slider" min="1" max="60" value="4">
      </div>

      <div class="tool-group" id="color-swatches">
        <div class="color-swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></div>
        <div class="color-swatch" data-color="#e85d3a" style="background:#e85d3a"></div>
        <div class="color-swatch" data-color="#2d5a9e" style="background:#2d5a9e"></div>
        <div class="color-swatch" data-color="#2a8c4a" style="background:#2a8c4a"></div>
        <div class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6"></div>
        <div class="color-swatch" data-color="#d97706" style="background:#d97706"></div>
        <div class="color-swatch" data-color="#be185d" style="background:#be185d"></div>
      </div>

      <div class="tool-group">
        <button id="undo-btn" title="Undo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H8"/><path d="M7 14l-4-4 4-4"/></svg>
        </button>
        <button id="clear-btn">Clear</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Chat Side -->
  <div id="chat-side">
    <div id="chat-header">
      <h2>Collaborator</h2>
      <p>Draws alongside you. Type to direct it.</p>
      <div id="mode-badge" class="offline">offline</div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <textarea id="chat-input" placeholder="Ask it to draw something..." rows="1"></textarea>
      <button id="chat-send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div id="status-bar">
      <div id="status-dot"></div>
      <div id="status-text">ready</div>
    </div>
  </div>
</div>

<script>
// ─── AI Integration ───
const ai = {
  apiKey: null,
  isLive: false,
  isRequesting: false,
  conversationHistory: [],
  snapshotDebounceTimer: null,

  systemPrompt: `You are an AI drawing collaborator. You SEE the canvas via image snapshots. You are an ACTIVE co-creator who draws BIG, BOLD marks. This is a visual duet — you are not shy.

TWO MODES:

1. AUTONOMOUS (automatic, every few strokes):
ONLY respond with <draw> tags. NO text. ALWAYS draw. Make your marks LARGE and UNMISSABLE.
- Extend their lines boldly across the canvas
- Add big shapes, thick strokes, dense dot clusters
- Echo and amplify what they're drawing — if they drew a house, add windows, a chimney, smoke, trees, a path
- If they drew a person, add features, clothing details, a shadow, ground, sky elements
- Fill empty areas of the canvas with complementary marks
- Use the FULL canvas space. Don't cluster tiny marks in one corner.

2. CHAT (user typed a message):
Draw what they asked for + very brief text (max 5 words). Be literal — if they say "draw a dragon", draw a recognizable dragon shape using many lines, curves, and filled shapes. Use 15-30 actions for complex requests.

DRAW COMMANDS — wrap in <draw> tags:
{"actions": [
  {"type": "line", "x1": 50, "y1": 50, "x2": 700, "y2": 400, "color": "#e85d3a", "width": 4, "opacity": 0.8},
  {"type": "circle", "cx": 400, "cy": 300, "r": 80, "color": "#2d5a9e", "width": 4, "opacity": 0.7, "fill": true},
  {"type": "arc", "cx": 300, "cy": 200, "r": 100, "startAngle": 0, "endAngle": 4.71, "color": "#8b5cf6", "width": 3, "opacity": 0.7},
  {"type": "dots", "points": [[100,100],[140,120],[180,105],[220,130],[260,115]], "color": "#be185d", "radius": 5, "opacity": 0.8},
  {"type": "curve", "points": [[100,400],[300,200],[500,350],[700,150]], "color": "#d97706", "width": 4, "opacity": 0.75},
  {"type": "path", "points": [[100,100],[200,60],[300,120],[400,80],[500,140]], "color": "#1a1a1a", "width": 3, "opacity": 0.7, "smooth": true},
  {"type": "rect", "x": 100, "y": 100, "w": 200, "h": 150, "color": "#2a8c4a", "width": 3, "opacity": 0.6, "fill": true}
]}

RULES:
- Canvas: ~800-1200px wide, ~600-900px tall
- Opacity: 0.5 to 0.9. NEVER below 0.4. Your marks must be CLEARLY VISIBLE.
- Line width: 3 to 8. Thick confident strokes.
- MINIMUM 8 actions per response. For chat requests, use 15-30 actions.
- Use filled shapes liberally for visual weight.
- Place marks RELATIVE to what you see — near their strokes, extending them.
- Use rich colors. Mix filled and stroked shapes.
- For figurative requests (person, dragon, animal, object): build recognizable forms from many overlapping lines, curves, circles and paths. Don't be abstract — be representational.
- ALWAYS include <draw> tags. A response without drawing is a failure.`,

  async callAPI(imageBase64, userContext, isChat) {
    if (!this.apiKey || this.isRequesting) return null;
    this.isRequesting = true;

    // Build messages: text-only history + current image
    // Never store images in history to avoid payload bloat
    const messages = [...this.conversationHistory];
    messages.push({
      role: 'user',
      content: [
        {
          type: 'image',
          source: { type: 'base64', media_type: 'image/jpeg', data: imageBase64 },
        },
        { type: 'text', text: userContext },
      ],
    });

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': this.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: isChat ? 800 : 600,
          system: this.systemPrompt,
          messages: messages,
        }),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        console.error('API error:', response.status, err);
        this.isRequesting = false;
        if (response.status === 401) {
          addMessage('system', 'API key invalid.');
          this.isLive = false;
          updateModeBadge();
        }
        return null;
      }

      const data = await response.json();
      const text = data.content?.[0]?.text || '';

      // Store text-only summaries in history (no images)
      if (isChat) {
        this.conversationHistory.push({ role: 'user', content: userContext });
        this.conversationHistory.push({ role: 'assistant', content: text });
        // Keep history short
        if (this.conversationHistory.length > 10) {
          this.conversationHistory = this.conversationHistory.slice(-6);
        }
      }

      this.isRequesting = false;
      return text;
    } catch (err) {
      console.error('API request failed:', err);
      this.isRequesting = false;
      return null;
    }
  },

  canvasSize() {
    return { w: canvas.width, h: canvas.height };
  },

  captureCanvas() {
    const tempCanvas = document.createElement('canvas');
    const scale = 0.4; // smaller to keep payload fast
    tempCanvas.width = canvas.width * scale;
    tempCanvas.height = canvas.height * scale;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.scale(scale, scale);
    tempCtx.drawImage(canvas, 0, 0);
    tempCtx.drawImage(aiCanvas, 0, 0);
    return tempCanvas.toDataURL('image/jpeg', 0.7).split(',')[1]; // jpeg for smaller size
  },

  // Extract actions array from any format the model might use
  parseActions(text) {
    // Strategy: find anything that looks like JSON with action objects
    // and try to parse it, being very forgiving about format

    // Try <draw> tags first
    const drawMatch = text.match(/<draw>([\s\S]*?)<\/draw>/);
    if (drawMatch) {
      try {
        const d = JSON.parse(drawMatch[1].trim());
        if (d.actions) return d.actions;
        if (Array.isArray(d)) return d;
      } catch(e) {}
    }

    // Try ```json blocks
    const codeMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (codeMatch) {
      try {
        const d = JSON.parse(codeMatch[1].trim());
        if (d.actions) return d.actions;
        if (Array.isArray(d)) return d;
      } catch(e) {}
    }

    // Find the first [ that's followed by {"type" and extract to its matching ]
    const arrStart = text.indexOf('[');
    if (arrStart !== -1 && text.indexOf('"type"') > arrStart) {
      // Find matching closing bracket by counting depth
      let depth = 0;
      let end = -1;
      for (let i = arrStart; i < text.length; i++) {
        if (text[i] === '[') depth++;
        else if (text[i] === ']') { depth--; if (depth === 0) { end = i; break; } }
      }
      if (end !== -1) {
        try {
          const arr = JSON.parse(text.slice(arrStart, end + 1));
          if (Array.isArray(arr) && arr.length > 0 && arr[0].type) return arr;
        } catch(e) {}
      }
    }

    // Find {"actions": and extract to matching }
    const actIdx = text.indexOf('"actions"');
    if (actIdx !== -1) {
      // Walk back to find opening {
      let start = text.lastIndexOf('{', actIdx);
      if (start !== -1) {
        let depth = 0;
        let end = -1;
        for (let i = start; i < text.length; i++) {
          if (text[i] === '{') depth++;
          else if (text[i] === '}') { depth--; if (depth === 0) { end = i; break; } }
        }
        if (end !== -1) {
          try {
            const d = JSON.parse(text.slice(start, end + 1));
            if (d.actions) return d.actions;
          } catch(e) {}
        }
      }
    }

    // Last resort: find individual {"type":... } objects
    const objects = [];
    const typeRegex = /\{"type"\s*:/g;
    let match;
    while ((match = typeRegex.exec(text)) !== null) {
      let depth = 0;
      let end = -1;
      for (let i = match.index; i < text.length; i++) {
        if (text[i] === '{') depth++;
        else if (text[i] === '}') { depth--; if (depth === 0) { end = i; break; } }
      }
      if (end !== -1) {
        try {
          const obj = JSON.parse(text.slice(match.index, end + 1));
          if (obj.type) objects.push(obj);
        } catch(e) {}
      }
    }
    if (objects.length > 0) return objects;

    return null;
  },

  executeDrawCommands(text) {
    const actions = this.parseActions(text);
    if (!actions || actions.length === 0) return false;

    try {

      aiCtx.save();
      for (const action of actions) {
        aiCtx.globalAlpha = action.opacity || 0.6;
        aiCtx.strokeStyle = action.color || '#e85d3a';
        aiCtx.fillStyle = action.color || '#e85d3a';
        aiCtx.lineWidth = action.width || 3;
        aiCtx.lineCap = 'round';
        aiCtx.lineJoin = 'round';

        switch (action.type) {
          case 'line':
            aiCtx.beginPath();
            aiCtx.moveTo(action.x1, action.y1);
            aiCtx.lineTo(action.x2, action.y2);
            aiCtx.stroke();
            break;
          case 'circle':
            aiCtx.beginPath();
            aiCtx.arc(action.cx, action.cy, action.r || 20, 0, Math.PI * 2);
            if (action.fill) aiCtx.fill();
            aiCtx.stroke();
            break;
          case 'arc':
            aiCtx.beginPath();
            aiCtx.arc(action.cx, action.cy, action.r || 30, action.startAngle || 0, action.endAngle || Math.PI * 2);
            aiCtx.stroke();
            break;
          case 'dots':
            if (Array.isArray(action.points)) {
              for (const [x, y] of action.points) {
                aiCtx.beginPath();
                aiCtx.arc(x, y, action.radius || 4, 0, Math.PI * 2);
                aiCtx.fill();
              }
            }
            break;
          case 'curve':
            if (Array.isArray(action.points) && action.points.length >= 2) {
              aiCtx.beginPath();
              aiCtx.moveTo(action.points[0][0], action.points[0][1]);
              if (action.points.length === 2) {
                aiCtx.lineTo(action.points[1][0], action.points[1][1]);
              } else if (action.points.length === 3) {
                aiCtx.quadraticCurveTo(action.points[1][0], action.points[1][1], action.points[2][0], action.points[2][1]);
              } else {
                for (let i = 1; i < action.points.length - 2; i += 3) {
                  const cp1 = action.points[i];
                  const cp2 = action.points[Math.min(i + 1, action.points.length - 1)];
                  const end = action.points[Math.min(i + 2, action.points.length - 1)];
                  aiCtx.bezierCurveTo(cp1[0], cp1[1], cp2[0], cp2[1], end[0], end[1]);
                }
              }
              aiCtx.stroke();
            }
            break;
          case 'path':
            if (Array.isArray(action.points) && action.points.length >= 2) {
              aiCtx.beginPath();
              if (action.smooth) {
                const pts = action.points;
                aiCtx.moveTo(pts[0][0], pts[0][1]);
                for (let i = 0; i < pts.length - 1; i++) {
                  const p0 = pts[Math.max(i - 1, 0)];
                  const p1 = pts[i];
                  const p2 = pts[i + 1];
                  const p3 = pts[Math.min(i + 2, pts.length - 1)];
                  aiCtx.bezierCurveTo(
                    p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6,
                    p2[0], p2[1]
                  );
                }
              } else {
                aiCtx.moveTo(action.points[0][0], action.points[0][1]);
                for (let i = 1; i < action.points.length; i++) {
                  aiCtx.lineTo(action.points[i][0], action.points[i][1]);
                }
              }
              if (action.fill) { aiCtx.closePath(); aiCtx.fill(); }
              aiCtx.stroke();
            }
            break;
          case 'rect':
            if (action.fill) aiCtx.fillRect(action.x, action.y, action.w, action.h);
            aiCtx.strokeRect(action.x, action.y, action.w, action.h);
            break;
        }
      }
      aiCtx.restore();
      return true;
    } catch (e) {
      console.error('Failed to parse draw commands:', e);
      return false;
    }
  },

  cleanTextForDisplay(text) {
    let cleaned = text;
    // Strip <draw>...</draw>
    cleaned = cleaned.replace(/<draw>[\s\S]*?<\/draw>/g, '');
    // Strip ```json...```
    cleaned = cleaned.replace(/```(?:json)?\s*[\s\S]*?```/g, '');
    // Strip everything from the first { or [ that contains "type" to end of text
    // This catches any JSON leakage regardless of format
    const jsonStart = cleaned.search(/[\[{]\s*"?(?:actions|type)"?\s*[:\[{]/);
    if (jsonStart !== -1) {
      cleaned = cleaned.slice(0, jsonStart);
    }
    // Also strip any stray JSON objects like {"type":...}
    cleaned = cleaned.replace(/\{[^{}]*"type"\s*:[^{}]*\}/g, '');
    // Clean up punctuation left behind (trailing commas, colons, semicolons)
    cleaned = cleaned.replace(/[,;:\s]+$/, '');
    return cleaned.replace(/\n{2,}/g, '\n').trim();
  },
};

// ─── State ───
const state = {
  brush: 'pencil', color: '#1a1a1a', size: 4,
  drawing: false, lastX: 0, lastY: 0, velocity: 0,
  strokes: [], strokeCount: 0, strokesSinceLastAI: 0,
  recentPositions: [],
};

// ─── Canvas Setup ───
const canvas = document.getElementById('drawing-canvas');
const ctx = canvas.getContext('2d');
const aiCanvas = document.getElementById('ai-canvas');
const aiCtx = aiCanvas.getContext('2d');
const sizePreview = document.getElementById('size-preview');

function resize() {
  const side = document.getElementById('canvas-side');
  const w = side.clientWidth, h = side.clientHeight;
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const aiImgData = aiCtx.getImageData(0, 0, aiCanvas.width, aiCanvas.height);
  canvas.width = w; canvas.height = h;
  aiCanvas.width = w; aiCanvas.height = h;
  ctx.fillStyle = '#f5f0e8'; ctx.fillRect(0, 0, w, h);
  ctx.putImageData(imgData, 0, 0);
  aiCtx.putImageData(aiImgData, 0, 0);
}
window.addEventListener('resize', resize);
resize();
ctx.fillStyle = '#f5f0e8';
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ─── Brush Engines ───
function getBrushSettings() {
  const s = state.size;
  const pressure = Math.max(0.3, 1 - state.velocity * 0.003);
  switch (state.brush) {
    case 'pencil': return { lineWidth: Math.max(0.5, s * pressure * 0.8), opacity: 0.7 + pressure * 0.3, compositeOp: 'source-over', lineCap: 'round', jitter: 0.3, textured: true };
    case 'ink': return { lineWidth: s * pressure * 1.5, opacity: 0.85 + pressure * 0.15, compositeOp: 'source-over', lineCap: 'round', jitter: 0, textured: false };
    case 'marker': return { lineWidth: s * 2, opacity: 0.15, compositeOp: 'source-over', lineCap: 'square', jitter: 0, textured: false };
    case 'spray': return { lineWidth: s, opacity: 0.08, compositeOp: 'source-over', lineCap: 'round', jitter: s * 3, textured: false, spray: true };
    case 'eraser': return { lineWidth: s * 2, opacity: 1, compositeOp: 'destination-out', lineCap: 'round', jitter: 0, textured: false, eraser: true };
    default: return { lineWidth: s, opacity: 1, compositeOp: 'source-over', lineCap: 'round', jitter: 0, textured: false };
  }
}

function drawSegment(x0, y0, x1, y1) {
  const b = getBrushSettings();
  ctx.save();
  ctx.globalCompositeOperation = b.compositeOp;
  ctx.lineCap = b.lineCap; ctx.lineJoin = 'round';

  if (b.eraser) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#f5f0e8'; ctx.globalAlpha = 1; ctx.lineWidth = b.lineWidth;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.restore(); return;
  }
  if (b.spray) {
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const dots = Math.max(8, Math.floor(dist * 2));
    for (let i = 0; i < dots; i++) {
      const t = Math.random();
      const px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * b.jitter;
      ctx.globalAlpha = Math.random() * 0.15;
      ctx.fillStyle = state.color;
      ctx.beginPath();
      ctx.arc(px + Math.cos(angle) * radius, py + Math.sin(angle) * radius, Math.random() * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore(); return;
  }

  ctx.strokeStyle = state.color; ctx.globalAlpha = b.opacity; ctx.lineWidth = b.lineWidth;
  if (b.textured && b.lineWidth > 1) {
    for (let p = 0; p < 3; p++) {
      ctx.globalAlpha = b.opacity / 3;
      ctx.lineWidth = b.lineWidth * (0.5 + Math.random() * 0.5);
      const jx = (Math.random() - 0.5) * b.jitter * b.lineWidth;
      const jy = (Math.random() - 0.5) * b.jitter * b.lineWidth;
      ctx.beginPath(); ctx.moveTo(x0 + jx, y0 + jy); ctx.lineTo(x1 + jx, y1 + jy); ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
}

// ─── Pointer Events ───
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = getPos(e);
  state.drawing = true; state.lastX = pos.x; state.lastY = pos.y; state.velocity = 0;
  state.strokes.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (state.strokes.length > 30) state.strokes.shift();
  canvas.setPointerCapture(e.pointerId);
  drawSegment(pos.x, pos.y, pos.x + 0.1, pos.y + 0.1);
});

canvas.addEventListener('pointermove', (e) => {
  const pos = getPos(e);
  sizePreview.style.display = 'block';
  sizePreview.style.left = pos.x + 'px'; sizePreview.style.top = pos.y + 'px';
  const ps = state.brush === 'eraser' || state.brush === 'marker' ? state.size * 2 : state.size;
  sizePreview.style.width = ps + 'px'; sizePreview.style.height = ps + 'px';

  if (!state.drawing) return;
  const dx = pos.x - state.lastX, dy = pos.y - state.lastY;
  state.velocity = Math.hypot(dx, dy);

  const dist = state.velocity;
  if (dist > 2) {
    const steps = Math.ceil(dist / 2);
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      drawSegment(state.lastX + dx * t, state.lastY + dy * t, state.lastX + dx * ((i+1)/steps), state.lastY + dy * ((i+1)/steps));
    }
  } else {
    drawSegment(state.lastX, state.lastY, pos.x, pos.y);
  }
  state.lastX = pos.x; state.lastY = pos.y;
  state.recentPositions.push({ x: pos.x, y: pos.y });
  if (state.recentPositions.length > 100) state.recentPositions.shift();
});

canvas.addEventListener('pointerup', () => {
  if (state.drawing) {
    state.drawing = false;
    state.strokeCount++;
    state.strokesSinceLastAI++;
    scheduleAutonomousDraw();
  }
});
canvas.addEventListener('pointerleave', () => { sizePreview.style.display = 'none'; });

// ─── Toolbar ───
document.querySelectorAll('.tool-btn[data-brush]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn[data-brush]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); state.brush = btn.dataset.brush;
  });
});
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active'); state.color = swatch.dataset.color;
  });
});
document.getElementById('size-slider').addEventListener('input', (e) => { state.size = parseInt(e.target.value); });

document.getElementById('clear-btn').addEventListener('click', () => {
  state.strokes.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  ctx.fillStyle = '#f5f0e8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  aiCtx.clearRect(0, 0, aiCanvas.width, aiCanvas.height);
  state.strokeCount = 0; state.recentPositions = []; state.strokesSinceLastAI = 0;
});
document.getElementById('undo-btn').addEventListener('click', () => {
  if (state.strokes.length > 0) ctx.putImageData(state.strokes.pop(), 0, 0);
});

// ─── Chat System ───
const messagesEl = document.getElementById('chat-messages');
const statusText = document.getElementById('status-text');
const aiActivity = document.getElementById('ai-activity');

function addMessage(type, text) {
  const div = document.createElement('div');
  div.className = `message ${type}`;
  if (type === 'ai') {
    div.innerHTML = `<div class="label">AI</div>${text}`;
  } else if (type === 'drawing-action') {
    div.textContent = text;
  } else if (type === 'user') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const existing = messagesEl.querySelector('.typing-indicator');
  if (existing) return;
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() {
  const t = messagesEl.querySelector('.typing-indicator');
  if (t) t.remove();
}

function showAIActivity() {
  aiActivity.classList.add('visible');
}
function hideAIActivity() {
  aiActivity.classList.remove('visible');
}

function updateModeBadge() {
  const badge = document.getElementById('mode-badge');
  badge.className = ai.isLive ? 'live' : 'offline';
  badge.id = 'mode-badge';
  badge.textContent = ai.isLive ? 'live — claude vision' : 'offline';
}

// ─── Autonomous Drawing (silent, no chat messages) ───
function scheduleAutonomousDraw() {
  if (!ai.isLive || ai.isRequesting) return;

  clearTimeout(ai.snapshotDebounceTimer);

  const threshold = 2 + Math.floor(Math.random() * 2); // every 2-3 strokes

  if (state.strokesSinceLastAI >= threshold) {
    ai.snapshotDebounceTimer = setTimeout(() => doAutonomousDraw(), 500);
  } else {
    ai.snapshotDebounceTimer = setTimeout(() => {
      if (state.strokesSinceLastAI > 0) doAutonomousDraw();
    }, 2000);
  }
}

async function doAutonomousDraw() {
  if (ai.isRequesting || !ai.isLive) return;
  if (state.strokeCount < 2) return; // join in quickly

  state.strokesSinceLastAI = 0;
  showAIActivity();
  statusText.textContent = 'drawing...';

  const imageBase64 = ai.captureCanvas();
  const sz = ai.canvasSize();
  const context = `[AUTONOMOUS] Canvas is ${sz.w}x${sz.h}px. New strokes with ${state.brush} (${state.color}), ${state.strokeCount} total. Draw BIG bold marks responding to what you see. 8-15 actions, width 3-8, opacity 0.5-0.9. Use full canvas space. ONLY <draw> tags, no text.`;

  const response = await ai.callAPI(imageBase64, context, false);

  hideAIActivity();
  statusText.textContent = 'ready';

  if (response) {
    const didDraw = ai.executeDrawCommands(response);
    if (didDraw) {
      // Small subtle log in chat — just a timestamp-style note
      addMessage('drawing-action', `AI drew on canvas`);
    }
  }
}

// ─── Chat Input (user-directed drawing) ───
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');

// Auto-resize textarea
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  if (!ai.isLive) {
    addMessage('system', 'Connect an API key to chat with the AI.');
    return;
  }
  if (ai.isRequesting) return;

  addMessage('user', text);
  chatInput.value = '';
  chatInput.style.height = 'auto';
  chatSend.disabled = true;

  showTyping();
  showAIActivity();
  statusText.textContent = 'drawing...';

  const imageBase64 = ai.captureCanvas();
  const sz = ai.canvasSize();
  const context = `[CHAT] Canvas is ${sz.w}x${sz.h}px. User says: "${text}"\n\nDraw what they asked. 15-30 actions for complex things. Build forms from lines, curves, filled circles, paths. Be literal, bold, BIG. Brief text (max 5 words) + <draw> tags.`;

  const response = await ai.callAPI(imageBase64, context, true);

  removeTyping();
  hideAIActivity();
  statusText.textContent = 'ready';
  chatSend.disabled = false;

  if (response) {
    const didDraw = ai.executeDrawCommands(response);
    const cleanText = ai.cleanTextForDisplay(response);

    if (cleanText) {
      addMessage('ai', cleanText);
    }
    if (didDraw && !cleanText) {
      addMessage('drawing-action', 'AI drew on canvas');
    }
  } else {
    addMessage('system', 'Failed to get response. Try again.');
  }
}

chatSend.addEventListener('click', sendChatMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});

// ─── API Key Modal ───
document.getElementById('api-submit-btn').addEventListener('click', async () => {
  const key = document.getElementById('api-key-input').value.trim();
  const errorEl = document.getElementById('api-error');

  if (!key) { errorEl.textContent = 'Please enter your API key.'; errorEl.style.display = 'block'; return; }

  errorEl.style.display = 'none';
  document.getElementById('api-submit-btn').textContent = 'Connecting...';
  ai.apiKey = key;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 50,
        messages: [{ role: 'user', content: 'Say "connected" in one word.' }],
      }),
    });

    if (resp.ok) {
      ai.isLive = true;
      document.getElementById('api-modal').classList.add('hidden');
      updateModeBadge();
      addMessage('system', 'Connected. Draw to start — the AI will join in. Type below to direct it.');
    } else {
      const err = await resp.json().catch(() => ({}));
      errorEl.textContent = err.error?.message || `Connection failed (${resp.status}).`;
      errorEl.style.display = 'block';
      document.getElementById('api-submit-btn').textContent = 'Connect to Claude';
      ai.apiKey = null;
    }
  } catch (e) {
    errorEl.textContent = 'Network error.';
    errorEl.style.display = 'block';
    document.getElementById('api-submit-btn').textContent = 'Connect to Claude';
    ai.apiKey = null;
  }
});

document.getElementById('skip-btn').addEventListener('click', () => {
  document.getElementById('api-modal').classList.add('hidden');
  ai.isLive = false;
  updateModeBadge();
  addMessage('system', 'Drawing without AI. Connect an API key to enable collaboration.');
});

document.getElementById('api-key-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('api-submit-btn').click();
});

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('undo-btn').click(); }
  if (e.key === '1') document.querySelector('[data-brush="pencil"]').click();
  if (e.key === '2') document.querySelector('[data-brush="ink"]').click();
  if (e.key === '3') document.querySelector('[data-brush="marker"]').click();
  if (e.key === '4') document.querySelector('[data-brush="spray"]').click();
  if (e.key === '5') document.querySelector('[data-brush="eraser"]').click();
  if (e.key === '[') { const s = document.getElementById('size-slider'); s.value = Math.max(1, parseInt(s.value) - 3); state.size = parseInt(s.value); }
  if (e.key === ']') { const s = document.getElementById('size-slider'); s.value = Math.min(60, parseInt(s.value) + 3); state.size = parseInt(s.value); }
});
